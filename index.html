<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="Excel2Map - afficher des lieux issus d'un fichier Excel sur une carte">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>excel2map</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;background:#f4f6f8;color:#17202a}
header{padding:12px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0 20px 0 0}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,.file-label{border:0;border-radius:7px;padding:9px 13px;background:#2563eb;color:white;cursor:pointer;font-weight:600}
button.secondary{background:#475569}.file-label input{display:none}.status{font-size:.9rem;color:#475569;margin-left:auto}
#map{flex:1;min-height:300px;position:relative}.leaflet-container{width:100%;height:100%}.leaflet-tile{max-width:none!important;max-height:none!important}.leaflet-popup-content{font-size:14px}
footer{background:#fff;border-top:1px solid #ddd;padding:7px 12px;font-size:.78rem;color:#64748b}
@media(max-width:650px){header{align-items:flex-start}.status{width:100%;margin-left:0}}
</style>
</head>
<body>
<header>
<h1>excel2map</h1>
<div class="controls">
<label class="file-label">📊 Charger XLS/XLSX<input id="file" type="file" accept=".xls,.xlsx"></label>
<button id="export" class="secondary" disabled>⬇ Exporter JSON</button>
<button id="clear" class="secondary" disabled>Effacer</button>
</div>
<div id="status" class="status">Choisissez un fichier Excel à deux colonnes.</div>
</header>
<div id="map"></div>
<footer>Format attendu : colonne 1 = intitulé du lieu · colonne 2 = latitude,longitude</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const map=L.map('map').setView([46.8,2.5],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'© OpenStreetMap contributors'
}).addTo(map);
let markers=L.layerGroup().addTo(map), points=[];
const status=document.getElementById('status'), fileInput=document.getElementById('file');
const exportBtn=document.getElementById('export'), clearBtn=document.getElementById('clear');

function parseCoord(v){
  if(typeof v==='number') return [v];
  if(v==null) return null;
  let s=String(v).trim().replace(/[()]/g,'').replace(/;/g,',');
  const p=s.split(/[,\\s]+/).filter(Boolean);
  if(p.length<2) return null;
  const lat=parseFloat(p[0].replace(',','.')), lon=parseFloat(p[1].replace(',','.'));
  return Number.isFinite(lat)&&Number.isFinite(lon)?[lat,lon]:null;
}
function showPoints(){
  markers.clearLayers();
  if(!points.length){exportBtn.disabled=true;clearBtn.disabled=true;return}
  const bounds=[];
  points.forEach((p,i)=>{
    const m=L.marker([p.latitude,p.longitude]).bindPopup(
      '<strong>'+escapeHtml(p.label)+'</strong><br>'+p.latitude.toFixed(6)+', '+p.longitude.toFixed(6)
    );
    m.addTo(markers); bounds.push([p.latitude,p.longitude]);
  });
  map.fitBounds(bounds,{padding:[30,30],maxZoom:15});
  exportBtn.disabled=false;clearBtn.disabled=false;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

fileInput.addEventListener('change',async()=>{
  const f=fileInput.files[0]; if(!f)return;
  try{
    const data=await f.arrayBuffer();
    const wb=XLSX.read(data,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    points=[]; let skipped=0;
    rows.forEach((r,i)=>{
      if(r.length<2)return;
      let label=String(r[0]).trim(), c=r[1];
      if(i===0 && /lieu|nom|intitul/i.test(label) && /lat|coord|longitude/i.test(String(c))) return;
      let xy=parseCoord(c);
      if(!xy && typeof c==='string'){
        const nums=c.match(/-?\\d+(?:[.,]\\d+)?/g);
        if(nums&&nums.length>=2) xy=[parseFloat(nums[0].replace(',','.')),parseFloat(nums[1].replace(',','.'))];
      }
      if(label && xy && xy[0]>=-90&&xy[0]<=90&&xy[1]>=-180&&xy[1]<=180)
        points.push({label,latitude:xy[0],longitude:xy[1]});
      else if(label) skipped++;
    });
    showPoints();
    status.textContent=`${points.length} lieu(x) affiché(s)`+(skipped?` · ${skipped} ligne(s) ignorée(s)`:'' )+`.`;
  }catch(e){status.textContent='Erreur de lecture du fichier : '+e.message;points=[];showPoints();}
});
exportBtn.addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(points,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='points.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
clearBtn.addEventListener('click',()=>{
  points=[];markers.clearLayers();fileInput.value='';exportBtn.disabled=true;clearBtn.disabled=true;
  status.textContent='Choisissez un fichier Excel à deux colonnes.';map.setView([46.8,2.5],6);
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('brise-caches.js').catch(()=>{});
</script>
</body>
</html>
